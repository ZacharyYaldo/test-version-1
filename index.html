<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a1029">
<title>Test Version 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600;700&display=swap">
<style>
/* One phone screen: stats on top, the pixel street, a news ticker, the open tab, and tabs at the bottom.
   Pixel face for headings and big numbers only; everything you read is the system font. */
:root {
  --bg: #1a1029; --panel: #241838; --raise: #2f2148; --line: #4a3570;
  --ink: #f6f0ff; --dim: #c4b5e0; --gold: #ffd45e; --pink: #ff7ac8; --lime: #9dff6b; --bad: #ff6b6b;
  --cork: #a06d3e; --paper: #f6ecd0; --paper-ink: #2a2118;
  --body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --pixel: 'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.4 var(--body); overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#app { position: relative; display: flex; flex-direction: column; height: 100%; max-width: 520px; margin: 0 auto; overflow: hidden; background: var(--bg);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
[hidden] { display: none !important; }
small { font: 700 11.5px/1.2 var(--body); letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
h1 { font: 700 40px/1 var(--pixel); color: var(--pink); }
h2 { font: 700 24px/1.15 var(--pixel); text-wrap: balance; }
h3 { font: 700 14px/1.3 var(--body); letter-spacing: .04em; text-transform: uppercase; color: var(--gold); margin: 18px 0 4px; }
img { image-rendering: pixelated; }
button { font: 600 15px var(--body); color: var(--ink); background: var(--raise); border: 2px solid var(--line); padding: 6px 10px; cursor: pointer; box-shadow: 0 3px 0 #0009; touch-action: manipulation; }
button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #0009; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
/* glimmer amounts carry the pixel sparkle in front */
.c::before { content: ''; display: inline-block; width: .85em; height: .85em; margin-right: 3px; vertical-align: -.05em; background: var(--glim) center / contain no-repeat; image-rendering: pixelated; }
button em { display: block; font: 700 13.5px var(--body); font-style: normal; color: var(--gold); }

#tip { position: fixed; z-index: 9; max-width: 270px; padding: 8px 10px; background: var(--paper); color: var(--paper-ink); border: 2px solid var(--paper-ink); box-shadow: 4px 4px 0 #000a; font-size: 14px; line-height: 1.35; pointer-events: none; }
[data-tip] { cursor: help; }

/* stats */
#top { display: grid; grid-template-columns: 1.35fr .9fr 1.15fr auto; gap: 6px; padding: 8px; border-bottom: 2px solid var(--line); align-items: center; }
.cash { display: flex; gap: 6px; align-items: center; min-width: 0; }
.cash img { width: 26px; height: 26px; flex: none; }
.cash b { display: block; font: 700 21px/1 var(--pixel); color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cash i { font: 600 13px var(--body); font-style: normal; color: var(--lime); }
.stat b { display: block; font: 700 17px/1.1 var(--pixel); }
.sus small { display: block; white-space: nowrap; }
.sus .meter { height: 10px; margin-top: 3px; }
.sus .meter span { background: linear-gradient(90deg, #ffb35e, var(--bad)); }
.sus.on small { color: var(--bad); animation: blink .6s steps(2) infinite; }
.glam { padding: 4px 8px; font-size: 13px; line-height: 1.1; }
.glam em { font-size: 12px; }
@keyframes blink { 50% { opacity: .35; } }
.meter { position: relative; height: 14px; background: #120a1e; border: 2px solid #000; overflow: hidden; }
.meter span { position: absolute; inset: 0 auto 0 0; transition: width .2s linear; }

/* the street */
#stage { position: relative; flex: 0 0 41%; min-height: 220px; background: #160d2b; overflow: hidden; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; cursor: pointer; }
#mute { position: absolute; right: 6px; bottom: 6px; width: 34px; height: 34px; padding: 0; font-size: 19px; line-height: 1; background: #120a1ed9; }
#mute.off { opacity: .45; text-decoration: line-through; }
#floats { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.float { position: absolute; transform: translate(-50%, -50%); font: 700 18px var(--pixel); text-shadow: 2px 2px 0 #000; animation: rise .9s ease-out forwards; white-space: nowrap; }
.float.dmg { color: #fff; }
.float.cash { color: var(--gold); font-size: 15px; }
@keyframes rise { to { transform: translate(-50%, -170%); opacity: 0; } }

/* the holdout's card and running effects, over the top of the street */
#over { position: absolute; left: 6px; right: 6px; top: 6px; display: grid; gap: 4px; pointer-events: none; }
#over > * { pointer-events: auto; }
#fx { display: flex; flex-wrap: wrap; gap: 4px; }
#fx:empty { display: none; }
.chip { display: flex; gap: 6px; align-items: center; max-width: 100%; padding: 2px 4px 2px 6px; font-size: 12px; line-height: 1.2; background: #120a1ee6; border: 2px solid; }
.chip.good { border-color: var(--lime); } .chip.bad { border-color: var(--bad); }
.chip b { white-space: nowrap; } .chip.good b { color: var(--lime); } .chip.bad b { color: var(--bad); }
.chip span { color: var(--dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip i { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }
.chip button { padding: 1px 6px; font-size: 12px; box-shadow: none; display: flex; gap: 4px; align-items: center; }
.chip button em { font-size: 12px; }

/* the Plays button in the corner of the street and its menu */
#plays { position: absolute; inset: 6px; pointer-events: none; z-index: 3; }
#plays > * { pointer-events: auto; }
.pbtn { position: absolute; left: 0; bottom: 0; display: flex; gap: 6px; align-items: center; height: 34px; padding: 0 10px 0 6px; font-size: 14px; font-weight: 700; background: #120a1ee6; border-color: var(--pink); }
.pbtn img { width: 22px; height: 22px; }
.pbtn.on { background: var(--pink); color: #1a1029; }
.pbtn .badge { top: -6px; right: -6px; width: auto; height: auto; min-width: 18px; padding: 0 3px; font: 700 11px/14px var(--body); font-style: normal; color: #1a1029; text-align: center; }
.pmenu { position: absolute; left: 0; bottom: 42px; width: min(360px, 100%); max-height: calc(100% - 42px); overflow-y: auto; display: grid; gap: 4px; padding: 6px; background: #120a1ef2; border: 2px solid var(--pink); box-shadow: 4px 4px 0 #000a; }
.prow { display: flex; gap: 8px; align-items: center; padding: 4px; border-bottom: 1px solid var(--line); }
.prow:last-child { border-bottom: 0; }
.prow > img { width: 28px; height: 28px; flex: none; }
.prow > div { flex: 1; min-width: 0; }
.prow b { font-size: 14px; }
.prow p { font-size: 12px; line-height: 1.3; color: var(--dim); }
.prow button { flex: none; min-width: 56px; padding: 6px 8px; font-size: 13px; background: var(--pink); color: #1a1029; border-color: #fff; }
.prow button:disabled { background: var(--raise); color: var(--dim); border-color: var(--line); opacity: 1; }
.prow small { flex: none; max-width: 80px; text-align: right; text-transform: none; letter-spacing: 0; }
.prow.locked > img { filter: brightness(0) invert(.4); }
.prow.locked b, .prow.locked p { opacity: .6; }
.bb { display: flex; gap: 8px; padding: 6px 8px; background: #120a1ed9; border: 2px solid var(--line); }
.bb .face { width: 44px; height: 56px; object-fit: cover; object-position: top; flex: none; background: #2f2148; border: 2px solid #000; }
.bbmain { flex: 1; min-width: 0; display: grid; gap: 3px; }
.bbname { display: flex; gap: 8px; align-items: baseline; }
.bbname b { font: 700 17px/1 var(--pixel); color: var(--pink); }
.will span { background: linear-gradient(90deg, #6bd3ff, #9b7bff); }
.will i { position: absolute; inset: 0; font: 700 11px/10px var(--body); font-style: normal; text-align: center; text-shadow: 1px 1px 0 #000; }
.bbline { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--dim); }
.bbline b { color: var(--ink); }
.weak { display: inline-flex; gap: 3px; align-items: center; margin-left: auto; }
.weak img { width: 18px; height: 18px; }
.eta { font-size: 12.5px; color: var(--lime); }
.eta.on { color: var(--bad); }

#news { padding: 6px 10px; min-height: 3.1em; background: var(--raise); border-block: 2px solid var(--line); font-size: 14.5px; line-height: 1.35; color: var(--dim); }

/* the open tab */
#panel { flex: 1; overflow-y: auto; padding: 8px; -webkit-overflow-scrolling: touch; }
.modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
.modes button { padding: 5px; font-size: 14px; }
.modes button.on { background: var(--pink); color: #1a1029; border-color: #fff; }
.row { display: flex; gap: 10px; align-items: center; padding: 8px; margin-bottom: 6px; background: var(--panel); border: 2px solid var(--line); }
.row .ic { width: 40px; height: 40px; flex: none; }
.row .info { flex: 1; min-width: 0; }
.row .info > b { font-size: 16px; }
.row .info p { font-size: 14px; color: var(--dim); line-height: 1.3; margin-top: 2px; }
.row .info p b { color: var(--lime); }
.lv { font: 700 13px var(--pixel); color: var(--gold); }
.tags:empty { display: none; }
.tag { display: inline-block; margin: 3px 6px 0 0; padding: 0 5px; font-size: 12px; font-weight: 700; border: 1px solid var(--line); color: var(--dim); }
.tag.hot { color: #1a1029; background: var(--lime); border-color: var(--lime); }
.buy { flex: none; min-width: 92px; padding: 6px 8px; background: #3a2858; }
.buy:not(:disabled) { border-color: var(--gold); }
.row.locked { opacity: .65; }
.row.locked .ic { filter: brightness(0) invert(.35); }
.row.target .face { width: 44px; height: 56px; object-fit: cover; object-position: top; flex: none; background: var(--raise); border: 2px solid #000; }
.row.target.now { border-color: var(--pink); }
.row.target.later { opacity: .6; }
.row.target .face.shadow { filter: brightness(0) opacity(.7); background: none; border-color: transparent; }
.stamp { flex: none; padding: 2px 6px; font: 700 13px var(--pixel); color: var(--lime); border: 2px solid var(--lime); transform: rotate(-8deg); text-transform: uppercase; }
.more { font-size: 13.5px; color: var(--dim); text-align: center; margin: 8px 0; }

/* the scheme board */
.board { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; padding: 12px 8px; background: var(--cork);
  background-image: radial-gradient(#0002 1px, transparent 1.5px), radial-gradient(#fff1 1px, transparent 1.5px); background-size: 7px 7px, 11px 11px; border: 3px solid #5a3a1e; }
.strings { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.strings polyline { fill: none; stroke: #d01c2c; stroke-width: 2; stroke-linejoin: round; filter: drop-shadow(1px 2px 0 #0006); }
.note { position: relative; padding: 14px 8px 8px; background: var(--paper); color: var(--paper-ink); box-shadow: 3px 3px 0 #0005; font-size: 13.5px; line-height: 1.3; }
.note:nth-child(odd) { transform: rotate(-1deg); } .note:nth-child(even) { transform: rotate(1.2deg); }
.note .pin { position: absolute; top: -6px; left: 50%; width: 20px; height: 20px; margin-left: -10px; z-index: 3; }
.note b { display: block; font-size: 15px; }
.note p { margin-top: 3px; }
.note .flavor { font-style: italic; color: #6a5a48; }
.note .need { font-weight: 700; color: #8a4a2a; }
.note button { width: 100%; margin-top: 6px; background: #2f2148; font-size: 13.5px; }
.note.later { opacity: .72; }
.note.done { background: #e9f3d8; }
.note .stamp { display: inline-block; margin-top: 6px; color: #2f7a2a; border-color: #2f7a2a; }

/* the town tab */
.town p { color: var(--dim); font-size: 14.5px; margin-top: 4px; }
.boxes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.boxes div { padding: 6px 8px; background: var(--panel); border: 2px solid var(--line); }
.boxes b { display: block; font: 700 19px/1.15 var(--pixel); }
.boxes i { font-style: normal; font-size: 12.5px; color: var(--dim); }
.big { display: block; width: 100%; margin-top: 8px; padding: 10px; font-size: 17px; background: var(--pink); color: #1a1029; border-color: #fff; }
.big em { color: #1a1029; }
.big.danger { background: var(--bad); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; align-items: end; }
.pair .big { margin-top: 0; }

#tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 2px solid var(--line); background: var(--bg); }
#tabs button { position: relative; display: grid; justify-items: center; gap: 2px; padding: 6px 0 8px; border: 0; box-shadow: none; background: none; font: 700 12px var(--body); text-transform: uppercase; color: var(--dim); }
#tabs button img { width: 24px; height: 24px; }
#tabs button.on { color: var(--ink); background: var(--raise); box-shadow: inset 0 3px 0 var(--pink); }
.badge { display: none; position: absolute; top: 5px; right: calc(50% - 20px); width: 10px; height: 10px; background: var(--lime); border: 2px solid #000; }
.badge.on { display: block; }

/* news events */
.card > small { display: block; color: var(--bad); }
.hit { padding: 6px 8px; background: #3a1420; border: 2px solid var(--bad); color: var(--ink) !important; font-size: 14px !important; }
.opts { display: grid; gap: 8px; margin-top: 12px; }
.opt { display: grid; gap: 2px; text-align: left; padding: 8px 10px; }
.opt b { font-size: 15px; } .opt span { font-size: 13px; color: var(--dim); }
.opt em { justify-self: start; }

/* pop-ups */
#modal { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; padding: 16px; background: #0b0614cc; }
.card { width: 100%; max-width: 400px; max-height: 92%; overflow-y: auto; padding: 18px 16px; background: var(--panel); border: 3px solid var(--pink); box-shadow: 6px 6px 0 #000; text-align: center; }
.card p, .card li { margin-top: 8px; color: var(--dim); font-size: 15px; }
.card p b, .card li b { color: var(--ink); }
.card ul { text-align: left; padding-left: 18px; }
.card .hero { display: block; margin: 0 auto 8px; width: 70px; height: 60px; object-fit: contain; }
.card .hero.face { width: 72px; height: 100px; object-fit: cover; object-position: top; border: 3px solid #000; background: var(--raise); }
.prize { font: 700 24px var(--pixel); color: var(--gold) !important; }
.opens { display: flex; gap: 8px; align-items: center; justify-content: center; }
.opens img { width: 28px; height: 28px; }
.next { font-size: 14px !important; }
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <div id="stage">
    <canvas id="scene" aria-label="The street. Tap to throw slop."></canvas>
    <div id="over"><div id="boss"></div><div id="fx"></div></div>
    <div id="plays"></div>
    <div id="floats"></div>
    <button id="mute" data-go="music" aria-label="Music on or off">&#9834;</button>
  </div>
  <p id="news"></p>
  <main id="panel"></main>
  <nav id="tabs"></nav>
  <div id="modal" hidden></div>
</div>
<div id="tip" role="tooltip" hidden></div>
<audio id="song1" src="audio/slop-1.mp3" preload="auto"></audio>
<audio id="song2" src="audio/slop-2.mp3" preload="auto"></audio>

  put('fx', fxKey(g), chips(g));
  put('plays', playsKey(g, G.menu), plays(g, G.menu));
  const scroll = $('panel').scrollTop;
  if (put('panel', panelKey(g, G.tab, G.mode), panel(g, G.tab, G.mode))) {
    $('panel').scrollTop = scroll;
    if (G.tab === 'schemes') requestAnimationFrame(() => stringUp($('panel')));
  }
  put('modal', m ? JSON.stringify(m) + g.boss : '', m ? `<div class="card">${modal(g, m)}</div>` : '');
  $('modal').hidden = !m;
  $('mute').classList.toggle('off', music.muted);
  for (const b of $('tabs').children) b.classList.toggle('on', b.dataset.tab === G.tab);
  live($('app'), values(g, rates(g), G.mode, m));
}

function act(go) {
  const g = G.g, [verb, arg] = go.split(':');
  if (verb === 'tab') { G.tab = arg; $('panel').scrollTop = 0; }
  else if (verb === 'mode') G.mode = arg === 'max' ? 'max' : +arg;
  else if (verb === 'buy') buy(g, arg, G.mode);
  else if (verb === 'scheme') buyScheme(g, arg);
  else if (verb === 'music') music.toggle();
  else if (verb === 'menu') G.menu = !G.menu;
  else if (verb === 'play') { if (play(g, arg)) { G.menu = false; news(`${PLAY[arg].name}! ${PLAY[arg].blurb}`); } }
  else if (verb === 'counter') counter(g, +arg);
  else if (verb === 'pick') { const then = G.queue[0]?.kind === 'event' && choose(g, G.queue[0].id, +arg); if (then) { G.queue.shift(); news(then); } }
  else if (verb === 'glamour') { if (glamour(g)) news('The fairies sprinkle glamour over town. Nobody remembers a thing.'); }
  else if (verb === 'help') G.queue.unshift({ kind: 'help' });
  else if (verb === 'ask') G.queue.unshift({ kind: arg });
  else if (verb === 'ok') { G.queue.shift(); g.seenIntro = true; }
  else if (verb === 'move' || verb === 'restart') {
    G.g = startOver(g, verb === 'move'); G.queue = []; G.tab = 'fronts';
    news(verb === 'move' ? `The fairies arrive in ${here(G.g).name}. Nobody notices.` : `The fairies start ${here(G.g).name} over. Nobody remembers the last time.`);
  } else if (verb === 'erase') { store.erase(); G.g = newGame(); G.queue = [{ kind: 'help' }]; G.tab = 'fronts'; }
  store.save(G.g);
  refresh();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-go]');
  if (el && !el.disabled) act(el.dataset.go);
});

// Tapping the street throws slop: damage at the holdout, glimmer in the pocket.
const floats = $('floats');
function float(x, y, text, cls) {
  const s = document.createElement('span');
  s.className = `float ${cls}`; s.textContent = text; s.style.left = `${x}px`; s.style.top = `${y}px`;
  floats.append(s); s.addEventListener('animationend', () => s.remove());
  while (floats.children.length > 24) floats.firstChild.remove();
}
$('scene').addEventListener('pointerdown', e => {
  e.preventDefault();
  if (G.queue.length) return;
  if (G.menu) { G.menu = false; refresh(); }
  const out = [], hit = tap(G.g, out), box = $('stage').getBoundingClientRect(), x = e.clientX - box.left, y = e.clientY - box.top;
  scene.shoot(G.g, performance.now(), scene.local(e));
  if (hit.dmg) float(x, y - 10, `-${fmt(hit.dmg)}`, 'dmg');
  float(x + 14, y + 6, `+${fmt(hit.cash)}`, 'cash c');
  handle(out);
});

function frame(now) {
  const dt = Math.min(.5, (now - (G.last || now)) / 1000), out = [];
  G.last = now;
  tick(G.g, dt, out);
  handle(out);
  music.tick();
  scene.draw(G.g, { pop: here(G.g).pop, dps: rates(G.g).dps, rush: fxSum(G.g, 'auto') > 0 }, now, dt);
  if (now - G.ui > 200) { G.ui = now; refresh(); }
  if (now - G.news > 8000) news(chatter(G.g));
  if (now - G.saved > CFG.saveEvery * 1000) { G.saved = now; store.save(G.g); }
  requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return store.save(G.g);
  welcomeBack(); G.last = 0; refresh();
});
addEventListener('pagehide', () => store.save(G.g));

document.documentElement.style.setProperty('--glim', `url("${iconURL('glimmer')}")`);
initTips();
refresh();
requestAnimationFrame(frame);
// Test handle for build/shot.py.
window.slop = { G, tick, handle, refresh, act, music, schemes: SCHEMES.map(s => s.id), plays: Object.keys(PLAY) };

return {  };
})();
</script>
